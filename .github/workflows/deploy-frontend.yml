name: Deploy Frontend to GCP

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Run ESLint
      run: pnpm lint

    - name: Run TypeScript type check
      run: pnpm type-check

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/1087321066171/locations/global/workloadIdentityPools/github-pool/providers/github-provider
        service_account: iswo-academy-sa@gifted-monitor-490019-j7.iam.gserviceaccount.com

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: gifted-monitor-490019-j7

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker gcr.io

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Install Kamal
      run: gem install kamal

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/google_compute_engine
        chmod 600 ~/.ssh/google_compute_engine
        printf 'Host 35.231.98.72\n  IdentityFile ~/.ssh/google_compute_engine\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config
        chmod 600 ~/.ssh/config

    - name: Deploy with Kamal
      run: |
        GCP_TOKEN=$(gcloud auth print-access-token)
        mkdir -p .kamal
        echo "KAMAL_REGISTRY_PASSWORD=${GCP_TOKEN}" > .kamal/secrets
        kamal deploy

    - name: Clean up
      run: rm -f ~/.ssh/google_compute_engine .kamal/secrets

    - name: Invalidate CDN cache (optional)
      run: |
        # Si tienes CDN configurado, invalida el cache
        # gcloud compute url-maps invalidate-cdn-cache LOAD_BALANCER_NAME --path="/*"
        echo "Frontend deployed successfully!"