name: Deploy Frontend to GCP

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Run ESLint
      run: pnpm lint

    - name: Run TypeScript type check
      run: pnpm type-check

    # - name: Run tests
    #   run: pnpm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Build application
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
        VITE_CABLE_URL: ${{ secrets.VITE_CABLE_URL }}
        VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      run: pnpm build

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/1087321066171/locations/global/workloadIdentityPools/github-pool/providers/github-provider
        service_account: iswo-academy-sa@gifted-monitor-490019-j7.iam.gserviceaccount.com

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: gifted-monitor-490019-j7

    - name: Deploy to Cloud Storage
      run: |
        # Upload hashed assets with long-lived cache (1 year)
        gsutil -m -h "Cache-Control:public, max-age=31536000, immutable" \
          rsync -r -d ./dist/assets gs://app-iswo-academy/assets

        # Upload index.html and other root files with no-cache so updates are picked up immediately
        gsutil -m -h "Cache-Control:no-cache, no-store, must-revalidate" \
          rsync -r -d -x "^assets/" ./dist gs://app-iswo-academy

    - name: Configure bucket for static website hosting
      run: |
        gsutil web set -m index.html -e index.html gs://app-iswo-academy
        gsutil iam ch allUsers:objectViewer gs://app-iswo-academy || true
        
        # Set public read permissions
        gsutil -m acl ch -r -u AllUsers:R gs://app-iswo-academy

    - name: Invalidate CDN cache (optional)
      run: |
        # Si tienes CDN configurado, invalida el cache
        # gcloud compute url-maps invalidate-cdn-cache LOAD_BALANCER_NAME --path="/*"
        echo "Frontend deployed successfully!"