name: Deploy Frontend to GCP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Run ESLint
      run: pnpm lint

    - name: Run TypeScript type check
      run: pnpm type-check

    # - name: Run tests
    #   run: pnpm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Build application
      env:
        VITE_API_URL: https://api.34-139-56-65.nip.io
      run: pnpm build

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy to Cloud Storage
      run: |
        # Sync files to bucket
        gsutil -m rsync -r -d ./dist gs://app-iswo-academy
        
        # Set public read permissions
        gsutil -m acl ch -r -u AllUsers:R gs://app-iswo-academy

    - name: Invalidate CDN cache (optional)
      run: |
        # Si tienes CDN configurado, invalida el cache
        # gcloud compute url-maps invalidate-cdn-cache LOAD_BALANCER_NAME --path="/*"
        echo "Frontend deployed successfully!"